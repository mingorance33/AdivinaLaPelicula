<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego: Adivina la Película</title>
    <style>
        :root {
            --p1: #ff4757; --p2: #2e86de; --p3: #2ed573; --p4: #ffa502;
            --bg: #1e272e;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg); color: white; margin: 0;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* --- MARCADOR --- */
        #scoreboard {
            display: flex; justify-content: space-around; padding: 10px; background: rgba(0,0,0,0.5);
        }
        .score-box { padding: 8px 15px; border-radius: 10px; font-weight: bold; min-width: 70px; text-align: center; }

        /* --- ZONA CENTRAL --- */
        #game-view {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px;
        }
        #points-label { font-size: 3.5rem; color: #f1c40f; margin: 5px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        
        #image-container {
            width: 90%; max-width: 400px; height: 50vh; border: 8px solid white;
            border-radius: 20px; overflow: hidden; background: #2c3e50;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        #movie-img { max-width: 100%; max-height: 100%; filter: blur(50px); display: none; }
        #placeholder-text { color: #7f8c8d; font-style: italic; }

        /* --- CONTROLES --- */
        #controls-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; background: #00000044;
        }
        .btn-stop {
            height: 65px; border: none; border-radius: 12px; color: white;
            font-size: 1.2rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }
        .btn-stop:active { transform: translateY(2px); box-shadow: none; }
        .btn-stop:disabled { background: #4b4b4b !important; opacity: 0.5; cursor: not-allowed; }

        #action-row {
            grid-column: 1 / -1; display: flex; justify-content: center; gap: 15px; margin-top: 5px;
        }
        .btn-action {
            padding: 12px 30px; font-size: 1.1rem; border: none; border-radius: 50px;
            color: white; cursor: pointer; font-weight: bold;
        }
        #btn-main { background: #2ed573; min-width: 150px; }
        #btn-reset { background: #ff4757; }

        /* --- MODAL --- */
        #modal-overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 999; justify-content: center; align-items: center;
        }
        #modal { background: white; color: black; padding: 30px; border-radius: 20px; text-align: center; width: 280px; }
        .modal-btns { display: flex; gap: 15px; margin-top: 20px; justify-content: center; }
        .modal-btns button { padding: 12px 20px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="scoreboard">
    <div class="score-box" style="background: var(--p1)">P1: <span id="s1">0</span></div>
    <div class="score-box" style="background: var(--p2)">P2: <span id="s2">0</span></div>
    <div class="score-box" style="background: var(--p3)">P3: <span id="s3">0</span></div>
    <div class="score-box" style="background: var(--p4)">P4: <span id="s4">0</span></div>
</div>

<div id="game-view">
    <div id="points-label">100</div>
    <div id="image-container">
        <span id="placeholder-text">Presiona EMPEZAR</span>
        <img id="movie-img" src="" alt="Peli">
    </div>
</div>

<div id="controls-grid">
    <button class="btn-stop" style="background: var(--p1)" onclick="playerStop(1)" id="stop1" disabled>ALTO P1</button>
    <button class="btn-stop" style="background: var(--p2)" onclick="playerStop(2)" id="stop2" disabled>ALTO P2</button>
    <button class="btn-stop" style="background: var(--p3)" onclick="playerStop(3)" id="stop3" disabled>ALTO P3</button>
    <button class="btn-stop" style="background: var(--p4)" onclick="playerStop(4)" id="stop4" disabled>ALTO P4</button>

    <div id="action-row">
        <button id="btn-main" class="btn-action" onclick="handleMainAction()">EMPEZAR</button>
        <button id="btn-reset" class="btn-action" onclick="restartEverything()">REINICIAR TODO</button>
    </div>
</div>

<div id="modal-overlay">
    <div id="modal">
        <h2 id="modal-player-title">¿Acertó el Jugador?</h2>
        <h3 id="correct-name" style="color: #2e86de">---</h3>
        <div class="modal-btns">
            <button style="background: #2ed573" onclick="resolveModal(true)">SÍ ✅</button>
            <button style="background: #ff4757" onclick="resolveModal(false)">NO ❌</button>
        </div>
    </div>
</div>

<script>
    // --- LISTA DE PELÍCULAS ---
    // (Cambia estas URLs por tus archivos locales cuando los tengas)
    const movieData = [
        { name: "TOY STORY", url: "https://picsum.photos/id/10/400/600" },
        { name: "FROZEN", url: "https://picsum.photos/id/20/400/600" },
        { name: "EL REY LEON", url: "https://picsum.photos/id/30/400/600" },
        { name: "SHREK", url: "https://picsum.photos/id/40/400/600" },
        { name: "CARS", url: "https://picsum.photos/id/50/400/600" }
    ];

    let deck = [];
    let currentIndex = 0;
    let points = 100;
    let gameTimer = null;
    let currentPlayer = null;
    let playerScores = [0, 0, 0, 0];

    const imgElement = document.getElementById('movie-img');
    const mainBtn = document.getElementById('btn-main');
    const pointsDisplay = document.getElementById('points-label');
    const placeholder = document.getElementById('placeholder-text');

    // Mezclar al inicio
    function shuffle() {
        deck = [...movieData].sort(() => Math.random() - 0.5);
    }

    function handleMainAction() {
        if (deck.length === 0 || currentIndex >= deck.length) {
            shuffle();
            currentIndex = 0;
        }
        startRound();
    }

    function startRound() {
        // Preparar UI
        placeholder.style.display = 'none';
        imgElement.style.display = 'block';
        imgElement.src = deck[currentIndex].url;
        imgElement.style.filter = "blur(50px)";
        
        points = 100;
        pointsDisplay.innerText = points;
        
        mainBtn.style.visibility = 'hidden'; // Escondemos para que no se pulse dos veces
        toggleStopButtons(true);
        
        // Iniciar cuenta atrás
        if (gameTimer) clearInterval(gameTimer);
        gameTimer = setInterval(() => {
            if (points > 0) {
                points--;
                pointsDisplay.innerText = points;
                imgElement.style.filter = `blur(${points / 2}px)`;
            } else {
                finishRound();
            }
        }, 150); // 15 segundos aprox por peli
    }

    function playerStop(num) {
        clearInterval(gameTimer);
        currentPlayer = num;
        toggleStopButtons(false);
        
        document.getElementById('modal-player-title').innerText = `¿Acertó Jugador ${num}?`;
        document.getElementById('correct-name').innerText = deck[currentIndex].name;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function resolveModal(isCorrect) {
        document.getElementById('modal-overlay').style.display = 'none';
        if (isCorrect) {
            playerScores[currentPlayer - 1] += points;
            updateScoreUI();
            finishRound();
        } else {
            // Continua el tiempo
            toggleStopButtons(true);
            gameTimer = setInterval(() => {
                if (points > 0) {
                    points--;
                    pointsDisplay.innerText = points;
                    imgElement.style.filter = `blur(${points / 2}px)`;
                } else {
                    finishRound();
                }
            }, 150);
        }
    }

    function finishRound() {
        clearInterval(gameTimer);
        imgElement.style.filter = "blur(0px)";
        currentIndex++;
        
        mainBtn.style.visibility = 'visible';
        mainBtn.innerText = currentIndex < deck.length ? "SIGUIENTE" : "VER RESULTADOS";
        toggleStopButtons(false);
    }

    function restartEverything() {
        clearInterval(gameTimer);
        playerScores = [0, 0, 0, 0];
        updateScoreUI();
        currentIndex = 0;
        shuffle();
        
        placeholder.style.display = 'block';
        imgElement.style.display = 'none';
        mainBtn.style.visibility = 'visible';
        mainBtn.innerText = "EMPEZAR";
        pointsDisplay.innerText = "100";
        toggleStopButtons(false);
    }

    function updateScoreUI() {
        playerScores.forEach((score, i) => {
            document.getElementById(`s${i+1}`).innerText = score;
        });
    }

    function toggleStopButtons(active) {
        for(let i=1; i<=4; i++) {
            document.getElementById(`stop${i}`).disabled = !active;
        }
    }

    // Inicializar
    shuffle();
</script>

</body>
</html>
