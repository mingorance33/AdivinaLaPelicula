<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina la Película - Kids v2.0</title>
    <style>
        :root {
            --p1: #ff4757; --p2: #2e86de; --p3: #2ed573; --p4: #ffa502;
            --bg: #1e272e;
        }
        body {
            font-family: 'Arial Rounded MT Bold', sans-serif;
            background: var(--bg); color: white; margin: 0;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        #scoreboard { display: flex; justify-content: space-around; padding: 10px; background: rgba(0,0,0,0.5); }
        .score-box { padding: 8px 15px; border-radius: 12px; font-weight: bold; min-width: 70px; text-align: center; border: 1px solid #ffffff33; }
        #game-view { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        #points-label { font-size: 3.5rem; color: #f1c40f; margin-bottom: 5px; text-shadow: 2px 2px 5px black; }
        #image-container {
            width: 95%; max-width: 600px; height: 50vh; 
            background: #2c3e50; border: 8px solid white; border-radius: 20px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            position: relative;
        }
        #movie-img { width: 100%; height: 100%; object-fit: contain; filter: blur(20px); display: none; }
        #status-msg { font-size: 1.1rem; color: #ffcc00; text-align: center; padding: 20px; font-family: monospace; }
        #controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; background: rgba(0,0,0,0.6); }
        .btn-stop { height: 75px; border: none; border-radius: 15px; color: white; font-size: 1.4rem; font-weight: bold; cursor: pointer; }
        .btn-stop:disabled { background: #4b4b4b !important; opacity: 0.3; }
        #action-row { grid-column: 1 / -1; display: flex; justify-content: center; gap: 20px; margin-top: 5px; }
        .btn-action { padding: 12px 30px; font-size: 1.1rem; border: none; border-radius: 50px; color: white; cursor: pointer; font-weight: bold; }
        #btn-main { background: #2ed573; min-width: 180px; }
        
        #modal-overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center;
        }
        #modal { background: white; color: black; padding: 25px; border-radius: 25px; text-align: center; width: 320px; }
        .modal-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .modal-btns button { padding: 12px; border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer; }

        .winner-msg { color: #2e86de; font-size: 1.5rem; margin-top: 10px; }
    </style>
</head>
<body>

<div id="scoreboard">
    <div class="score-box" style="background: var(--p1)">P1: <span id="s1">0</span></div>
    <div class="score-box" style="background: var(--p2)">P2: <span id="s2">0</span></div>
    <div class="score-box" style="background: var(--p3)">P3: <span id="s3">0</span></div>
    <div class="score-box" style="background: var(--p4)">P4: <span id="s4">0</span></div>
</div>

<div id="game-view">
    <div id="points-label">100</div>
    <div id="image-container">
        <div id="status-msg">Cargando desde GitHub...</div>
        <img id="movie-img" src="">
    </div>
</div>

<div id="controls">
    <button class="btn-stop" style="background: var(--p1)" onclick="playerStop(1)" id="stop1" disabled>ALTO P1</button>
    <button class="btn-stop" style="background: var(--p2)" onclick="playerStop(2)" id="stop2" disabled>ALTO P2</button>
    <button class="btn-stop" style="background: var(--p3)" onclick="playerStop(3)" id="stop3" disabled>ALTO P3</button>
    <button class="btn-stop" style="background: var(--p4)" onclick="playerStop(4)" id="stop4" disabled>ALTO P4</button>

    <div id="action-row">
        <button id="btn-main" class="btn-action" onclick="nextRound()" style="display:none">EMPEZAR</button>
        <button class="btn-action" style="background: #ff4757" onclick="askReset()">REINICIAR</button>
    </div>
</div>

<div id="modal-overlay">
    <div id="modal">
        <div id="modal-content-game">
            <h2 id="modal-title">¿Acertó Jugador <span id="pl-num"></span>?</h2>
            <h3 id="correct-name" style="color: #2e86de; text-transform: uppercase; margin: 10px 0;"></h3>
            <div id="winner-announcement"></div>
            <div class="modal-btns" id="modal-buttons-div">
                <button style="background: #2ed573" onclick="confirmHit(true)">SÍ ✅</button>
                <button style="background: #ff4757" onclick="confirmHit(false)">NO ❌</button>
                <button style="background: #7f8c8d" onclick="undoStop()">VOLVER (Error) ↩️</button>
            </div>
        </div>

        <div id="modal-content-reset" style="display:none">
            <h2>¿REINICIAR JUEGO?</h2>
            <p>Se perderán todos los puntos acumulados.</p>
            <div class="modal-btns">
                <button style="background: #ff4757" onclick="location.reload()">SÍ, REINICIAR 🔄</button>
                <button style="background: #7f8c8d" onclick="closeModal()">CANCELAR</button>
            </div>
        </div>

        <div class="modal-btns" id="reset-button-div" style="display:none">
            <button style="background: #2e86de" onclick="location.reload()">JUGAR OTRA VEZ 🎮</button>
        </div>
    </div>
</div>

<script>
    const GITHUB_USER = "mingorance33"; 
    const GITHUB_REPO = "AdivinaLaPelicula";

    let deck = [];
    let currentIdx = 0;
    let points = 100;
    let timer = null;
    let activePlayer = null;
    let scores = [0, 0, 0, 0];

    const img = document.getElementById('movie-img');
    const pointsTxt = document.getElementById('points-label');
    const mainBtn = document.getElementById('btn-main');
    const statusMsg = document.getElementById('status-msg');
    const overlay = document.getElementById('modal-overlay');

    // Función para pedir reinicio (abre el modal)
    function askReset() {
        clearInterval(timer); // Pausamos el tiempo mientras decide
        document.getElementById('modal-content-game').style.display = 'none';
        document.getElementById('reset-button-div').style.display = 'none';
        document.getElementById('modal-content-reset').style.display = 'block';
        overlay.style.display = 'flex';
    }

    function closeModal() {
        overlay.style.display = 'none';
        document.getElementById('modal-content-reset').style.display = 'none';
        document.getElementById('modal-content-game').style.display = 'block';
        // Si el juego estaba en marcha (puntos > 0 y < 100), reanudamos
        if (img.style.display === 'block' && activePlayer === null && points > 0) {
            startTimer();
        }
    }

    async function loadFilesFromGitHub() {
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`;
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("Error");
            const files = await response.json();
            deck = files
                .filter(file => {
                    const name = file.name.toLowerCase();
                    return name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.png');
                })
                .map(file => ({
                    name: file.name.split('.')[0].replace(/-/g, ' ').replace(/_/g, ' '),
                    url: file.download_url
                }))
                .sort(() => Math.random() - 0.5);

            if (deck.length > 0) {
                statusMsg.innerText = `¡${deck.length} películas listas!`;
                mainBtn.style.display = 'block';
            }
        } catch (e) {
            statusMsg.innerHTML = `Error al conectar con GitHub.`;
        }
    }

    function nextRound() {
        if (currentIdx >= deck.length) {
            showFinalWinner();
            return;
        }
        statusMsg.style.display = 'none';
        img.style.display = 'block';
        img.src = deck[currentIdx].url;
        img.style.filter = "blur(20px)";
        points = 100;
        pointsTxt.innerText = points;
        mainBtn.style.visibility = 'hidden';
        setStops(true);
        startTimer();
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            if (points > 0) {
                points--;
                pointsTxt.innerText = points;
                img.style.filter = `blur(${points / 5}px)`;
            } else {
                finishRound();
            }
        }, 150);
    }

    function playerStop(num) {
        clearInterval(timer);
        activePlayer = num;
        setStops(false);
        document.getElementById('pl-num').innerText = num;
        document.getElementById('correct-name').innerText = deck[currentIdx].name;
        document.getElementById('modal-content-reset').style.display = 'none';
        document.getElementById('modal-content-game').style.display = 'block';
        overlay.style.display = 'flex';
    }

    function undoStop() {
        overlay.style.display = 'none';
        activePlayer = null;
        setStops(true);
        startTimer();
    }

    function confirmHit(correct) {
        overlay.style.display = 'none';
        if (correct && activePlayer) {
            scores[activePlayer - 1] += points;
            updateScores();
        } 
        finishRound();
    }

    function finishRound() {
        clearInterval(timer);
        activePlayer = null;
        img.style.filter = "blur(0px)";
        currentIdx++;
        if (currentIdx >= deck.length) {
            showFinalWinner();
        } else {
            mainBtn.style.visibility = 'visible';
            mainBtn.innerText = "SIGUIENTE";
            setStops(false);
        }
    }

    function showFinalWinner() {
        const maxScore = Math.max(...scores);
        const winners = [];
        scores.forEach((s, i) => { if(s === maxScore) winners.push(i + 1); });

        let mensaje = maxScore === 0 ? "¡Nadie puntuó! 😅" : 
                     (winners.length === 1 ? `¡GANADOR JUGADOR ${winners[0]}! 🏆` : `¡EMPATE: Jugadores ${winners.join(", ")}! 🤝`);

        document.getElementById('modal-title').innerText = "¡FIN DEL JUEGO!";
        document.getElementById('correct-name').innerText = "Resultados Finales";
        document.getElementById('winner-announcement').innerHTML = `<div class="winner-msg">${mensaje}</div>`;
        document.getElementById('modal-buttons-div').style.display = 'none';
        document.getElementById('reset-button-div').style.display = 'flex';
        document.getElementById('modal-content-reset').style.display = 'none';
        overlay.style.display = 'flex';
    }

    function updateScores() {
        scores.forEach((s, i) => document.getElementById(`s${i+1}`).innerText = s);
    }

    function setStops(on) {
        for(let i=1; i<=4; i++) document.getElementById(`stop${i}`).disabled = !on;
    }

    loadFilesFromGitHub();
</script>
</body>
</html>
