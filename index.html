<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina la Película - Kids v2.0</title>
    <style>
        :root {
            --p1: #ff4757; --p2: #2e86de; --p3: #2ed573; --p4: #ffa502;
            --bg: #1e272e;
        }
        body {
            font-family: 'Arial Rounded MT Bold', sans-serif;
            background: var(--bg); color: white; margin: 0;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        #scoreboard { display: flex; justify-content: space-around; padding: 10px; background: rgba(0,0,0,0.5); }
        .score-box { padding: 8px 15px; border-radius: 12px; font-weight: bold; min-width: 70px; text-align: center; border: 1px solid #ffffff33; }
        #game-view { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        #points-label { font-size: 3.5rem; color: #f1c40f; margin-bottom: 5px; text-shadow: 2px 2px 5px black; }
        #image-container {
            width: 95%; max-width: 600px; height: 50vh; 
            background: #2c3e50; border: 8px solid white; border-radius: 20px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            position: relative;
        }
        /* Ajustado: el blur inicial ahora es de solo 20px para mayor nitidez */
        #movie-img { width: 100%; height: 100%; object-fit: contain; filter: blur(20px); display: none; }
        #status-msg { font-size: 1.1rem; color: #ffcc00; text-align: center; padding: 20px; font-family: monospace; }
        #controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; background: rgba(0,0,0,0.6); }
        .btn-stop { height: 75px; border: none; border-radius: 15px; color: white; font-size: 1.4rem; font-weight: bold; cursor: pointer; }
        .btn-stop:disabled { background: #4b4b4b !important; opacity: 0.3; }
        #action-row { grid-column: 1 / -1; display: flex; justify-content: center; gap: 20px; margin-top: 5px; }
        .btn-action { padding: 12px 30px; font-size: 1.1rem; border: none; border-radius: 50px; color: white; cursor: pointer; font-weight: bold; }
        #btn-main { background: #2ed573; min-width: 180px; }
        #modal-overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center;
        }
        #modal { background: white; color: black; padding: 30px; border-radius: 25px; text-align: center; width: 300px; }
        .modal-btns { display: flex; gap: 15px; margin-top: 25px; }
        .modal-btns button { flex: 1; padding: 15px; border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>

<div id="scoreboard">
    <div class="score-box" style="background: var(--p1)">P1: <span id="s1">0</span></div>
    <div class="score-box" style="background: var(--p2)">P2: <span id="s2">0</span></div>
    <div class="score-box" style="background: var(--p3)">P3: <span id="s3">0</span></div>
    <div class="score-box" style="background: var(--p4)">P4: <span id="s4">0</span></div>
</div>

<div id="game-view">
    <div id="points-label">100</div>
    <div id="image-container">
        <div id="status-msg">Cargando desde GitHub...</div>
        <img id="movie-img" src="">
    </div>
</div>

<div id="controls">
    <button class="btn-stop" style="background: var(--p1)" onclick="playerStop(1)" id="stop1" disabled>ALTO P1</button>
    <button class="btn-stop" style="background: var(--p2)" onclick="playerStop(2)" id="stop2" disabled>ALTO P2</button>
    <button class="btn-stop" style="background: var(--p3)" onclick="playerStop(3)" id="stop3" disabled>ALTO P3</button>
    <button class="btn-stop" style="background: var(--p4)" onclick="playerStop(4)" id="stop4" disabled>ALTO P4</button>

    <div id="action-row">
        <button id="btn-main" class="btn-action" onclick="nextRound()" style="display:none">EMPEZAR</button>
        <button class="btn-action" style="background: #ff4757" onclick="location.reload()">REINICIAR</button>
    </div>
</div>

<div id="modal-overlay">
    <div id="modal">
        <h2>¿Acertó Jugador <span id="pl-num"></span>?</h2>
        <h3 id="correct-name" style="color: #2e86de; text-transform: uppercase;"></h3>
        <div class="modal-btns">
            <button style="background: #2ed573" onclick="confirm(true)">SÍ ✅</button>
            <button style="background: #ff4757" onclick="confirm(false)">NO ❌</button>
        </div>
    </div>
</div>

<script>
    /** 
     * CONFIGURACIÓN IMPORTANTE 
     * Pon aquí tus datos de GitHub
     */
    const GITHUB_USER = "mingorance33"; 
    const GITHUB_REPO = "AdivinaLaPelicula";

    let deck = [];
    let currentIdx = 0;
    let points = 100;
    let timer = null;
    let activePlayer = null;
    let scores = [0, 0, 0, 0];

    const img = document.getElementById('movie-img');
    const pointsTxt = document.getElementById('points-label');
    const mainBtn = document.getElementById('btn-main');
    const statusMsg = document.getElementById('status-msg');

    async function loadFilesFromGitHub() {
        if(GITHUB_USER.includes("AQUÍ")) {
            statusMsg.innerHTML = "ERROR:<br>Edita el archivo index.html y pon tu usuario de GitHub.";
            return;
        }

        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`;
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}: Verifica que el repo sea PÚBLICO.`);
            
            const files = await response.json();
            deck = files
                .filter(file => {
                    const name = file.name.toLowerCase();
                    return name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.png');
                })
                .map(file => ({
                    name: file.name.split('.')[0].replace(/-/g, ' ').replace(/_/g, ' '),
                    url: file.download_url
                }))
                .sort(() => Math.random() - 0.5);

            if (deck.length > 0) {
                statusMsg.innerText = `¡${deck.length} películas listas!`;
                mainBtn.style.display = 'block';
            } else {
                statusMsg.innerText = "No se encontraron fotos en el repositorio.";
            }
        } catch (e) {
            statusMsg.innerHTML = `Error de conexión. Revisa que tu repo sea público.`;
        }
    }

    function nextRound() {
        if (currentIdx >= deck.length) {
            alert("¡Has terminado todas las películas!");
            location.reload();
            return;
        }
        statusMsg.style.display = 'none';
        img.style.display = 'block';
        img.src = deck[currentIdx].url;
        
        // Blur inicial más nítido (20px)
        img.style.filter = "blur(20px)";
        
        points = 100;
        pointsTxt.innerText = points;
        mainBtn.style.visibility = 'hidden';
        setStops(true);
        startTimer();
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            if (points > 0) {
                points--;
                pointsTxt.innerText = points;
                // Fórmula para bajar de 20px a 0px proporcionalmente
                img.style.filter = `blur(${points / 5}px)`;
            } else {
                finishRound();
            }
        }, 150);
    }

    function playerStop(num) {
        clearInterval(timer);
        activePlayer = num;
        setStops(false);
        document.getElementById('pl-num').innerText = num;
        document.getElementById('correct-name').innerText = deck[currentIdx].name;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function confirm(correct) {
        document.getElementById('modal-overlay').style.display = 'none';
        if (correct) {
            scores[activePlayer - 1] += points;
            updateScores();
        } 
        
        // NUEVA LÓGICA: Tanto si acierta como si falla, revelamos y pasamos a la siguiente
        finishRound();
    }

    function finishRound() {
        clearInterval(timer);
        img.style.filter = "blur(0px)";
        currentIdx++;
        mainBtn.style.visibility = 'visible';
        mainBtn.innerText = "SIGUIENTE";
        setStops(false);
    }

    function updateScores() {
        scores.forEach((s, i) => document.getElementById(`s${i+1}`).innerText = s);
    }

    function setStops(on) {
        for(let i=1; i<=4; i++) document.getElementById(`stop${i}`).disabled = !on;
    }

    loadFilesFromGitHub();
</script>
</body>
</html>
