<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina la Película - 4 Jugadores</title>
    <style>
        :root {
            --p1: #ff4757; --p2: #2e86de; --p3: #2ed573; --p4: #ffa502;
            --bg: #1e272e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- MARCADOR --- */
        #scoreboard {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(0,0,0,0.4);
        }
        .score-box {
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
        }

        /* --- ZONA CENTRAL --- */
        #main-display {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #points-label {
            font-size: 3rem;
            color: #f1c40f;
            margin-bottom: 10px;
            font-weight: 900;
        }

        #image-frame {
            width: 100%;
            max-width: 450px;
            height: 60vh;
            border: 10px solid white;
            border-radius: 20px;
            background: #3d3d3d;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #movie-img {
            max-width: 100%;
            max-height: 100%;
            filter: blur(50px);
            transition: filter 0.1s linear;
        }

        #empty-msg {
            position: absolute;
            font-size: 1.2rem;
            color: #aaa;
        }

        /* --- CONTROLES --- */
        #controls {
            background: rgba(0,0,0,0.5);
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-stop {
            height: 80px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.3);
        }

        .btn-stop:active { transform: translateY(3px); box-shadow: none; }
        .btn-stop:disabled { background: #57606f !important; opacity: 0.5; cursor: default; }

        #action-bar {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .btn-action {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        #btn-start { background: #2ed573; }
        #btn-reset { background: #ff7f50; }

        /* --- MODAL --- */
        #modal-overlay {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #modal {
            background: white;
            color: black;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 80%;
        }

        .modal-btns { display: flex; gap: 20px; margin-top: 30px; justify-content: center; }
        .modal-btns button { padding: 15px 30px; font-size: 1.1rem; border: none; border-radius: 10px; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div id="scoreboard">
    <div class="score-box" style="background: var(--p1)">P1: <span id="s1">0</span></div>
    <div class="score-box" style="background: var(--p2)">P2: <span id="s2">0</span></div>
    <div class="score-box" style="background: var(--p3)">P3: <span id="s3">0</span></div>
    <div class="score-box" style="background: var(--p4)">P4: <span id="s4">0</span></div>
</div>

<div id="main-display">
    <div id="points-label">100</div>
    <div id="image-frame">
        <div id="empty-msg">Dale a EMPEZAR</div>
        <img id="movie-img" src="" style="display:none">
    </div>
</div>

<div id="controls">
    <button class="btn-stop" style="background: var(--p1)" onclick="triggerStop(1)" id="stop1" disabled>ALTO P1</button>
    <button class="btn-stop" style="background: var(--p2)" onclick="triggerStop(2)" id="stop2" disabled>ALTO P2</button>
    <button class="btn-stop" style="background: var(--p3)" onclick="triggerStop(3)" id="stop3" disabled>ALTO P3</button>
    <button class="btn-stop" style="background: var(--p4)" onclick="triggerStop(4)" id="stop4" disabled>ALTO P4</button>

    <div id="action-bar">
        <button id="btn-start" class="btn-action" onclick="handleStart()">EMPEZAR</button>
        <button id="btn-reset" class="btn-action" onclick="resetGame()">REINICIAR</button>
    </div>
</div>

<div id="modal-overlay">
    <div id="modal">
        <h1 id="modal-msg">¿Acertaste?</h1>
        <h2 id="movie-name" style="color: #2e86de">---</h2>
        <div class="modal-btns">
            <button style="background: #2ed573" onclick="confirmPoint(true)">SÍ, PUNTO</button>
            <button style="background: #ff4757" onclick="confirmPoint(false)">NO, SIGUE</button>
        </div>
    </div>
</div>

<script>
    // --- LISTA DE PELÍCULAS (Puedes cambiar las URLs por tus archivos) ---
    const library = [
        { name: "TOY STORY", url: "https://m.media-amazon.com/images/I/71K9XyS9sRL._AC_SL1000_.jpg" },
        { name: "FROZEN", url: "https://m.media-amazon.com/images/I/717S+ZzO9HL._AC_SL1000_.jpg" },
        { name: "EL REY LEON", url: "https://m.media-amazon.com/images/I/81BInp-tXvL._AC_SL1500_.jpg" },
        { name: "SHREK", url: "https://m.media-amazon.com/images/I/516WPCVCH9L._AC_.jpg" },
        { name: "MOANA", url: "https://m.media-amazon.com/images/I/91p6Yf8EjtL._AC_SL1500_.jpg" }
    ];

    let movies = [];
    let currentIdx = 0;
    let points = 100;
    let timer = null;
    let activePlayer = 0;
    let scores = [0, 0, 0, 0];

    const img = document.getElementById('movie-img');
    const pointsText = document.getElementById('points-label');
    const startBtn = document.getElementById('btn-start');

    function shuffle() {
        movies = [...library].sort(() => Math.random() - 0.5);
    }

    function handleStart() {
        if (movies.length === 0 || currentIdx >= movies.length) {
            shuffle();
            currentIdx = 0;
        }
        startRound();
    }

    function startRound() {
        document.getElementById('empty-msg').style.display = 'none';
        img.style.display = 'block';
        img.src = movies[currentIdx].url;
        img.style.filter = "blur(50px)";
        
        points = 100;
        pointsText.innerText = points;
        
        startBtn.style.display = 'none';
        setStops(true);
        
        runTimer();
    }

    function runTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            if (points > 0) {
                points--;
                pointsText.innerText = points;
                img.style.filter = `blur(${points / 2}px)`;
            } else {
                clearInterval(timer);
                reveal();
            }
        }, 150);
    }

    function triggerStop(player) {
        clearInterval(timer);
        activePlayer = player;
        setStops(false);
        document.getElementById('movie-name').innerText = movies[currentIdx].name;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function confirmPoint(isCorrect) {
        document.getElementById('modal-overlay').style.display = 'none';
        if (isCorrect) {
            scores[activePlayer - 1] += points;
            updateScores();
            reveal();
        } else {
            setStops(true);
            runTimer();
        }
    }

    function reveal() {
        img.style.filter = "blur(0px)";
        currentIdx++;
        startBtn.style.display = 'block';
        startBtn.innerText = currentIdx < movies.length ? "SIGUIENTE" : "FIN (REPETIR)";
    }

    function resetGame() {
        clearInterval(timer);
        scores = [0, 0, 0, 0];
        updateScores();
        currentIdx = 0;
        shuffle();
        img.style.display = 'none';
        document.getElementById('empty-msg').style.display = 'block';
        startBtn.style.display = 'block';
        startBtn.innerText = "EMPEZAR";
        pointsText.innerText = "100";
        setStops(false);
    }

    function updateScores() {
        scores.forEach((s, i) => {
            document.getElementById(`s${i+1}`).innerText = s;
        });
    }

    function setStops(enabled) {
        for(let i=1; i<=4; i++) {
            document.getElementById(`stop${i}`).disabled = !enabled;
        }
    }

    // Mezclar al cargar por primera vez
    shuffle();
</script>

</body>
</html>
